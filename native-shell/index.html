<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#073B4C" />
    <title>الذات | ATHAT</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #073b4c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      #app-frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #f8f6f1; opacity: 0; transition: opacity .22s ease; }
      #app-frame.ready { opacity: 1; }
      #loader { position: fixed; inset: 0; display: grid; place-items: center; padding: 28px; background: #073b4c; color: #ffffff; text-align: center; z-index: 2; }
      .card { width: min(360px, 100%); }
      .logo { width: 118px; height: 118px; object-fit: contain; border-radius: 26px; display: block; margin: 0 auto 18px; }
      h1 { margin: 0; font-size: 28px; font-weight: 900; }
      p { margin: 10px 0 0; color: #c7e4e1; line-height: 1.8; font-size: 14px; }
      .spinner { width: 34px; height: 34px; margin: 22px auto 0; border: 3px solid rgba(241,233,221,.25); border-top-color: #79d2ca; border-radius: 50%; animation: spin .8s linear infinite; }
      #error { display: none; margin-top: 22px; }
      #error.show { display: block; }
      button { width: 100%; border: 1px solid rgba(241,233,221,.25); background: #79d2ca; color: #073b4c; border-radius: 12px; padding: 12px 16px; font-weight: 800; font-size: 14px; }
      small { display: block; margin-top: 12px; color: #a9c9c7; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="loader" role="status" aria-live="polite">
      <div class="card">
        <img class="logo" src="./brand-final.webp" alt="شعار الذات" />
        <h1>الذات | ATHAT</h1>
        <p id="status">جارٍ تحميل التطبيق…</p>
        <div id="spinner" class="spinner" aria-hidden="true"></div>
        <div id="error">
          <button id="retry" type="button">إعادة المحاولة</button>
          <small>تحقق من اتصال الإنترنت ثم أعد المحاولة.</small>
        </div>
      </div>
    </div>

    <iframe
      id="app-frame"
      title="تطبيق الذات"
      src="https://athat.app/?native=android"
      allow="camera; microphone; clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>

    <script>
      (() => {
        const frame = document.getElementById("app-frame");
        const loader = document.getElementById("loader");
        const status = document.getElementById("status");
        const spinner = document.getElementById("spinner");
        const error = document.getElementById("error");
        const retry = document.getElementById("retry");
        let timer;

        function armTimeout() {
          clearTimeout(timer);
          timer = setTimeout(() => {
            status.textContent = "استغرق التحميل وقتًا أطول من المعتاد.";
            spinner.style.display = "none";
            error.classList.add("show");
          }, 15000);
        }

        function markReady() {
          clearTimeout(timer);
          frame.classList.add("ready");
          loader.style.display = "none";
        }

        frame.addEventListener("load", markReady);
        retry.addEventListener("click", () => {
          error.classList.remove("show");
          spinner.style.display = "block";
          status.textContent = "جارٍ إعادة تحميل التطبيق…";
          frame.classList.remove("ready");
          frame.src = "https://athat.app/?native=android&retry=" + Date.now();
          armTimeout();
        });

        armTimeout();
      })();
    </script>
  </body>
</html>
