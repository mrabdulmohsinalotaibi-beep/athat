name: Build check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: TypeScript check
        run: npx tsc --noEmit --pretty false
      - name: Validate browser extension
        run: npm run check:extension
      - name: Package Athat Bridge
        run: zip -qr athat-bridge.zip browser-extension
      - name: Upload Athat Bridge
        uses: actions/upload-artifact@v4
        with:
          name: athat-bridge
          path: athat-bridge.zip
          if-no-files-found: error
