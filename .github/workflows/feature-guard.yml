name: Guard AI and public feedback features

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-feature-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify protected feature files
        run: |
          set -euo pipefail
          test -f src/components/PublicFeedback.tsx
          test -f src/routes/feedback.$token.tsx
          test -f src/lib/ai.ts
          test -f supabase/functions/ai-assist/index.ts
          test -f supabase/migrations/20260918194000_feedback_and_ai.sql
          test -f AI_SETUP.md
          grep -q "DEEPSEEK_API_KEY" AI_SETUP.md
          grep -q "feedback_messages" supabase/migrations/20260918194000_feedback_and_ai.sql
          grep -q "DEEPSEEK_API_KEY" supabase/functions/ai-assist/index.ts
          grep -q "submit_public_feedback" supabase/migrations/20260918194000_feedback_and_ai.sql
