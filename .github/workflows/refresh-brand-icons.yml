name: Refresh ATHAT Brand Icons

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "public/athat-logo-final.png"
      - ".github/workflows/refresh-brand-icons.yml"

permissions:
  contents: write

concurrency:
  group: athat-brand-icons
  cancel-in-progress: true

jobs:
  icons:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install SVG tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick

      - name: Generate browser and install icons
        run: |
          convert public/athat-logo-final.png -resize 180x180 public/apple-touch-icon.png
          convert public/athat-logo-final.png -resize 192x192 public/icon-192x192.png
          convert public/athat-logo-final.png -resize 512x512 public/icon-512x512.png
          convert public/athat-logo-final.png -resize 64x64 public/favicon.png
          convert public/favicon.png -define icon:auto-resize=64,48,32,16 public/favicon.ico

      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/apple-touch-icon.png public/icon-192x192.png public/icon-512x512.png public/favicon.png public/favicon.ico
          if git diff --cached --quiet; then
            echo "Brand icons are already current."
            exit 0
          fi
          git commit -m "Refresh browser and PWA brand icons"
          git pull --rebase origin main
          git push origin HEAD:main
