name: Verify Cloudflare Pages Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Production deployment is performed by the Cloudflare Pages project directly
# connected to this repository. Keeping this workflow build-only prevents a
# duplicate deployment from failing when no GitHub API-token secret is present.
jobs:
  verify:
    name: Build for Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Pages output
        run: NITRO_PRESET=cloudflare-pages npm run build

      - name: Verify Pages output
        run: |
          # Nitro emits the Pages worker bundle and static assets inside dist.
          test -d dist/_worker.js
          test -f dist/_routes.json
          test -d dist
          echo "Cloudflare Pages output is ready. Cloudflare Git integration publishes main automatically."
