name: Publish Android to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install project dependencies
        run: npm ci

      - name: Install Capacitor build tools
        run: npm install --no-save @capacitor/core@7.4.3 @capacitor/android@7.4.3 @capacitor/cli@7.4.3

      - name: Prepare native shell
        run: cp public/athat-icon.svg native-shell/athat-icon.svg

      - name: Generate Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Apply ATHAT launcher icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#FBF7F1</color>
          </resources>
          EOF
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            size="${spec##*:}"
            dir="android/app/src/main/res/mipmap-${density}"
            mkdir -p "$dir"
            rsvg-convert -w "$size" -h "$size" public/athat-icon.svg -o "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done
          for spec in "mdpi:108" "hdpi:162" "xhdpi:216" "xxhdpi:324" "xxxhdpi:432"; do
            density="${spec%%:*}"
            size="${spec##*:}"
            dir="android/app/src/main/res/mipmap-${density}"
            rsvg-convert -w "$size" -h "$size" public/athat-icon.svg -o "$dir/ic_launcher_foreground.png"
          done

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/athat-release.jks

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat >> android/gradle.properties <<EOF
          ATHAT_STORE_FILE=athat-release.jks
          ATHAT_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          ATHAT_KEY_ALIAS=$ANDROID_KEY_ALIAS
          ATHAT_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          old = 'android {\n    namespace "app.athat.android"'
          if old not in s:
              raise SystemExit("Expected Capacitor Android namespace block not found")
          s = s.replace(
              old,
              'android {\n    signingConfigs {\n        release {\n            storeFile file(ATHAT_STORE_FILE)\n            storePassword ATHAT_STORE_PASSWORD\n            keyAlias ATHAT_KEY_ALIAS\n            keyPassword ATHAT_KEY_PASSWORD\n        }\n    }\n    namespace "app.athat.android"',
              1,
          )
          needle = "    buildTypes {\n        release {"
          if needle not in s:
              raise SystemExit("Expected release build type not found")
          s = s.replace(
              needle,
              "    buildTypes {\n        release {\n            signingConfig signingConfigs.release",
              1,
          )
          p.write_text(s)
          PY

      - name: Build release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATHAT-Google-Play-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.athat.android
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: completed
